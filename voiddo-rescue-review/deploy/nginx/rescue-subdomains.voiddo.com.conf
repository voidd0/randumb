server {
    listen 80;
    listen [::]:80;
    server_name app.rescue.voiddo.com api.rescue.voiddo.com audit.rescue.voiddo.com go.rescue.voiddo.com status.rescue.voiddo.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rescue.voiddo.com;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.rescue.voiddo.com audit.rescue.voiddo.com go.rescue.voiddo.com status.rescue.voiddo.com;

    ssl_certificate /etc/letsencrypt/live/rescue-subdomains.voiddo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rescue-subdomains.voiddo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.rescue.voiddo.com;

    ssl_certificate /etc/letsencrypt/live/rescue-subdomains.voiddo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rescue-subdomains.voiddo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
