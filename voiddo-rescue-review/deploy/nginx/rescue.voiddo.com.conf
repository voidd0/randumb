server {
    listen 80;
    listen [::]:80;
    server_name rescue.voiddo.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rescue.voiddo.com;
        default_type "text/plain";
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rescue.voiddo.com;

    root /var/www/rescue.voiddo.com;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/rescue.voiddo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rescue.voiddo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    location ^~ /downloads/ {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /voiddo-rescue-mvp-code-2026-05-26.zip {
        add_header X-Content-Type-Options "nosniff" always;
        try_files /downloads/voiddo-rescue-mvp-code-2026-05-26.zip =404;
    }

    location = /voiddo-rescue-mvp-code-2026-05-26.zip.sha256 {
        add_header X-Content-Type-Options "nosniff" always;
        try_files /downloads/voiddo-rescue-mvp-code-2026-05-26.zip.sha256 =404;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
